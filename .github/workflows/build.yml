name: Build EXE

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name AtikSimulasyonu Main.py
      - uses: actions/upload-artifact@v4
        with:
          name: AtikSimulasyonu-exe
          path: dist/AtikSimulasyonu.exe
